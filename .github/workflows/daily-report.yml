name: Moral Injury Daily Report

on:
  schedule:
    - cron: "50 3 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Target date (YYYY-MM-DD), leave empty for today"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      - name: Determine date
        id: date
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "target=${{ github.event.inputs.date }}" >> "$GITHUB_OUTPUT"
          else
            TARGET=$(TZ=Asia/Taipei date +%Y-%m-%d)
            echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          fi
          echo "Date: $(grep target "$GITHUB_OUTPUT" | cut -d= -f2)"

      - name: Fetch papers from PubMed
        run: node src/fetch_papers.mjs --days 7 --max-papers 40 --output papers.json
        continue-on-error: true
        timeout-minutes: 10

      - name: Check papers data
        id: papers
        run: |
          if [ -f papers.json ] && grep -q '"count"' papers.json; then
            COUNT=$(node -e "const d=require('./papers.json'); console.log(d.count||0)")
            echo "count=$COUNT" >> "$GITHUB_OUTPUT"
            echo "Papers found: $COUNT"
          else
            echo "count=0" >> "$GITHUB_OUTPUT"
            echo '{"date":"${{ steps.date.outputs.target }}","count":0,"papers":[]}' > papers.json
            echo "No papers found"
          fi

      - name: Configure NVIDIA Nemotron backend
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("src/generate_report.mjs")
          s = p.read_text(encoding="utf-8")
          s = s.replace("https://open.bigmodel.cn/api/coding/paas/v4", "https://integrate.api.nvidia.com/v1")
          s = re.sub(
              r'const MODEL_CHAIN = \[[^\n]+\];',
              'const MODEL_CHAIN = ["nvidia/nemotron-3-super-120b-a12b", "nvidia/nemotron-3-nano-30b-a3b"];',
              s,
          )
          s = re.sub(r"const MAX_TOKENS = [0-9_]+;", "const MAX_TOKENS = 16384;", s)
          s = s.replace("temperature: 0.3", "temperature: 1.0")
          s = s.replace("top_p: 0.9", "top_p: 0.95")
          marker = "max_tokens: MAX_TOKENS,"
          if marker in s and "chat_template_kwargs" not in s:
              s = s.replace(
                  marker,
                  marker + "\n            chat_template_kwargs: { enable_thinking: false },",
                  1,
              )
          p.write_text(s, encoding="utf-8")
          PY

      - name: Generate report with NVIDIA Nemotron
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          test -n "$NVIDIA_API_KEY" || { echo "::error::Missing NVIDIA_API_KEY repository secret"; exit 1; }
          node src/generate_report.mjs \
            --input papers.json \
            --output "docs/moral-injury-${{ steps.date.outputs.target }}.html" \
            --summarized-file data/summarized_pmids.json
        timeout-minutes: 15

      - name: Generate index page
        run: node src/generate_index.mjs

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ data/summarized_pmids.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "📄 moral injury daily report: ${{ steps.date.outputs.target }}"
          git pull --rebase origin main
          git push

      - name: Summary
        if: always()
        run: |
          echo "### 📄 Moral Injury Daily Report" >> "$GITHUB_STEP_SUMMARY"
          echo "**Date:** ${{ steps.date.outputs.target }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Papers analyzed:** ${{ steps.papers.outputs.count || '0' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Report:** [moral-injury-${{ steps.date.outputs.target }}.html](https://u8901006.github.io/moral-injury/moral-injury-${{ steps.date.outputs.target }}.html)" >> "$GITHUB_STEP_SUMMARY"
